name: Test IPO Alerts Cron
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: true
        default: 'DEBUG'
      checkUntil:
        description: 'Future days to check for IPOs'
        required: true
        default: '3'
      threshold:
        description: 'GMP Threshold for IPOs to be alerted on'
        required: true
        default: '30'
      fallbackThreshold:
        description: 'Fallback threshold for IPOs to be alerted on'
        required: true
        default: '20'
      notify:
        description: 'Notify via Telegram'
        required: true
        default: 'false'

jobs:
  ipo-cron:
    name: IPO Alerts Daily Cron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ipo-cron
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r ipo-alert/requirements.txt

      - name: Run IPO Alert script
        if: ${{ github.event.inputs.notify == 'false' }}
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_GROUP_ID: ${{ secrets.WHAPI_GROUP_ID }}
          WHAPI_API_URL: ${{ vars.WHAPI_API_URL }}
          GMP_BASE_URL: ${{ vars.GMP_BASE_URL }}
          IPO_SUBSCRIPTION_BASE_URL: ${{ vars.IPO_SUBSCRIPTION_BASE_URL }}
          IPO_GMP_BASE_URL: ${{ vars.IPO_GMP_BASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python ipo-alert/alert.py -d ${{ github.event.inputs.checkUntil }} -t ${{ github.event.inputs.threshold }} --fallback-threshold ${{ github.event.inputs.logLevel }} --github-secrets --dry-run  --log-level ${{ github.event.inputs.logLevel }}

      - name: Run IPO Alert script with Telegram Notification
        if: ${{ github.event.inputs.notify == 'true' }}
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_GROUP_ID: ${{ secrets.WHAPI_GROUP_ID }}
          WHAPI_API_URL: ${{ vars.WHAPI_API_URL }}
          GMP_BASE_URL: ${{ vars.GMP_BASE_URL }}
          IPO_SUBSCRIPTION_BASE_URL: ${{ vars.IPO_SUBSCRIPTION_BASE_URL }}
          IPO_GMP_BASE_URL: ${{ vars.IPO_GMP_BASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python ipo-alert/alert.py -d ${{ github.event.inputs.checkUntil }} -t ${{ github.event.inputs.threshold }} --fallback-threshold ${{ github.event.inputs.logLevel }} --github-secrets --log-level ${{ github.event.inputs.logLevel }}
